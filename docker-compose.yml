services:
  bot:
    build: .
    image: algobet-bot:latest
    container_name: algobet-bot
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./excel_mapping.yaml:/app/excel_mapping.yaml:ro
      - ./signal_rules.yaml:/app/signal_rules.yaml:ro
    restart: unless-stopped
    stop_signal: SIGINT

  web:
    build: .
    image: algobet-bot:latest
    container_name: algobet-web
    env_file:
      - .env
    command: ["uvicorn", "app.web_admin:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${WEB_ADMIN_PORT:-48291}:8000"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./excel_mapping.yaml:/app/excel_mapping.yaml:ro
      - ./signal_rules.yaml:/app/signal_rules.yaml:ro
    restart: unless-stopped
